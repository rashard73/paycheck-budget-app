

{% extends "base.html" %}

{% block title %}{{ 'Edit Bill' if bill else 'Add Bill' }}{% endblock %}

{% block content %}

<div class="card shadow-sm mx-auto" style="max-width: 550px;">
    <div class="card-body p-4">

        <h2 class="mb-4">
            {{ 'Edit Bill' if bill else 'Add Bill' }}
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label for="name" class="form-label">
                    Bill Name
                </label>
                <input type="text"
                       id="name"
                       name="name"
                       class="form-control"
                       value="{{ bill[1] if bill else '' }}"
                       required>
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">
                    Amount
                </label>
                <input type="number"
                       id="amount"
                       name="amount"
                       class="form-control"
                       min="0.01"
                       step="0.01"
                       value="{{ '%.2f'|format(bill[2] / 100) if bill else '' }}"
                       required>
            </div>

            <div class="mb-3">
                <label for="due_date" class="form-label">
                    Due Date
                </label>
                <input type="date"
                       id="due_date"
                       name="due_date"
                       class="form-control"
                       value="{{ bill[3] if bill else '' }}"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Bill
            </button>

            <a href="{{ url_for('show_bills', paycheck_id=paycheck_id) }}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </form>
    </div>
</div>

{% endblock %}
