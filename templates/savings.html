
{% extends "base.html" %}

{% block title %}Manage Savings{% endblock %}

{% block content %}

<div class="card shadow-sm mx-auto" style="max-width: 550px;">
    <div class="card-body p-4">

        <h2 class="mb-3">Manage Savings</h2>

        <p class="text-muted">
            Paycheck:
            ${{ "%.2f"|format(paycheck[1] / 100) }}
        </p>

        <form method="POST">

            <div class="mb-3">
                <label for="amount" class="form-label">
                    Savings Amount
                </label>
                <input type="number"
                       id="amount"
                       name="amount"
                       class="form-control"
                       min="0"
                       step="0.01"
                       value="{{ '%.2f'|format(savings / 100) }}"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Save Savings
            </button>

            <a href="{{ url_for('show_bills', paycheck_id=paycheck[0]) }}"
               class="btn btn-outline-secondary">
                Cancel
            </a>

        </form>
    </div>
</div>

{% endblock %}
